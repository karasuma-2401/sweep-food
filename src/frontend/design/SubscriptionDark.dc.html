<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-800:#B7E4C7;--green-700:#40916C;--green-100:#17301F;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--bg:#101511;--surface:#1A211C;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px}
    .topbar h1{font-size:18px;font-weight:700;margin:0}
    .rnd{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
    .content{padding:8px 20px;display:flex;flex-direction:column;gap:16px}
    .cur{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
    .cur .lb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .cur .nm{font-size:20px;font-weight:700;margin-top:4px}
    .inc{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    .inc .i{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
    .inc .i .c{width:18px;height:18px;border-radius:50%;background:var(--fill);color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none}
    .btn{width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:600;background:var(--green-700);color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
    .note{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.5}
  </style>
</helmet>
<div class="screen">
  <div class="topbar">
    <span class="rnd"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
    <h1>Gói dịch vụ</h1>
  </div>

  <div class="content">
    <div class="cur">
      <div class="lb">Gói hiện tại</div>
      <div class="nm">Miễn phí</div>
      <div class="inc">
        <div class="i"><span class="c"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>Tối đa 40 nguyên liệu đang lưu</div>
        <div class="i"><span class="c"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>10 lượt quét tem / hóa đơn mỗi tháng</div>
        <div class="i"><span class="c"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>Gợi ý món &amp; dinh dưỡng cơ bản</div>
        <div class="i"><span class="c"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>Cảnh báo thời hạn</div>
      </div>
    </div>

    <button class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5Z"/></svg>Nâng cấp Premium</button>

    <div class="note">Gói Premium mở khóa kho không giới hạn, thực đơn tuần, báo cáo và chia sẻ tủ bếp. Thanh toán qua App Store / Google Play.</div>
  </div>
</div>
</x-dc>
</body>
</html>
