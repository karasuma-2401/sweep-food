name: frontend
description: "SweepFood - Smart food management and recipe recommendation app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1

  # Local Storage & Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Hardware & Multimodal
  # camera: ^0.11.0+1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  # record: ^5.1.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # UI & Charts
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
